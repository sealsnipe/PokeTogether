[loggers]
keys=root,gameLogger,coreLogger,entitiesLogger,mapsLogger,uiLogger,battleLogger,itemsLogger,pokemonLogger,utilsLogger,networkLogger

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler
qualname=root

[logger_gameLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game
propagate=0

[logger_coreLogger]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=src.game.core
propagate=0

[logger_entitiesLogger]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=src.game.entities
propagate=0

[logger_mapsLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.maps
propagate=0

[logger_uiLogger]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=src.game.ui
propagate=0

[logger_battleLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.battle
propagate=0

[logger_itemsLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.items
propagate=0

[logger_pokemonLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.pokemon
propagate=0

[logger_utilsLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.utils
propagate=0

[logger_networkLogger]
level=INFO
handlers=consoleHandler,fileHandler
qualname=src.game.network
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('game.log', 'a')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
